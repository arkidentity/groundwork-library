name: Release

# On a version tag: check the library, then zip each plugin for upload in Claude desktop
# (Settings → Customize → Plugins → Upload) and attach the zips to the GitHub release.
# START.md links to releases/latest/download/groundwork.zip, so that link always gets the newest.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Tag matches library.yml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^version: *//p' library.yml | head -1)"
          [ "$tag" = "$ver" ] || { echo "Tag v$tag does not match library.yml version $ver"; exit 1; }

      # Each zip has .claude-plugin/plugin.json at its top level (what Claude's uploader looks for),
      # with forward-slash paths. Zips made by Windows' Compress-Archive use backslashes and are refused.
      - name: Build plugin zips
        run: |
          mkdir -p dist
          for dir in plugins/*/; do
            name="$(basename "$dir")"
            (cd "$dir" && zip -r -X "../../dist/$name.zip" .claude-plugin skills)
            unzip -l "dist/$name.zip" | grep -q ' \.claude-plugin/plugin\.json$' \
              || { echo "dist/$name.zip has no top-level .claude-plugin/plugin.json"; exit 1; }
          done
          ls -l dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.zip --clobber
          else
            gh release create "$tag" dist/*.zip --title "$tag" \
              --notes "What changed: https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md. To add the plugin in Claude desktop, upload groundwork.zip; see https://github.com/${GITHUB_REPOSITORY}/blob/main/START.md."
          fi
