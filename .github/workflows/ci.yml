name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the client-name guard reads all of history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Templates, skills, index, changelog, question bank.
      - run: npm run validate
      # The validator itself, and the sync script, against throwaway repos.
      - run: npm test
      # This repo is public. Fail if a client name ever lands in a file, a commit message, or history.
      # The pattern is a repository secret (a list committed here would leak the names); forks skip it.
      - name: Client-name guard
        env:
          DENYLIST_REGEX: ${{ secrets.DENYLIST_REGEX }}
        run: node scripts/check-denylist.mjs
      # A release tag must match the version in library.yml.
      - name: Tag matches library.yml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^version: *//p' library.yml | head -1)"
          if [ "$tag" != "$ver" ]; then
            echo "Tag v$tag does not match library.yml version $ver"
            exit 1
          fi
