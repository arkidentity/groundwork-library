name: church-website
version: 0.2.0
title: Church website
description: >
  Information discovery for a church website: prefill what we can find, confirm it, let the client
  shape the page list, then ask only what is left, in rounds of 3 or fewer. Facts go to content/, voice to messaging/. Conversion strategy and the question
  bank live in this folder. Design is not in here.
vars:
  church: the church's short name as people say it (e.g. "Hope")
  street: the street the church is on, if known (used in the first-visit question)
  from: who on the team is asking (usually the person who has the relationship)
  date: today
project:
  slug: website
  title: Your new website
  summary: The pages, the facts, and how a first visit works.
  audience: all
pairs_with:
  - template: messaging
    note: >
      Messaging is the upsell. Its story questions (who walks in, what they carry, why, their words)
      answer Section 1 of the question bank. Without it, Section 1 stays light and copy is written
      from the client's own sentences in calls and answers.
# Static items copied from this folder, with their rounds. The confirm items (topic `confirm`,
# round 1) are NOT here: the skill generates them from what it found, 3 items at most.
# Rounds per project: a client sees one round at a time; the next opens when they finish it.
items:
  q-pages: round 2 · the page list (sitemap:); drives the per-page conversations
  x-001: round 2 · three quick facts (phone and text, prayer requests, who updates the site)
  x-002: round 3 · links (sites they love, giving and livestream, a recent bulletin)
  q-visit: round 3 · the first-Sunday walk-through (the highest-value page; ask it for every church)
  x-003: round 4 · logo, colors, photos
  q-wonder: round 4 · what confuses a first-timer; kids and accessibility
  q-after: round 5 · after the service; first-timers' questions
  q-tools1: round 6 · giving, people database, volunteers
  q-tools2: round 7 · calendar, email, sign-ups
rules:
  round_size: 3          # items per round, at most
  prompts_per_item: 2    # a request may carry 3 short ones
  default_tools: none    # no default stack: when a church has nothing, recommend per church
generate:
  - content/_coverage.md: gates, section status, blockers (see the skill)
  - content/<section>.md: one file per bank section, every fact marked unconfirmed with a source
  - "topic `confirm` items: Does this look right? (planned + one-tap confirm), round 1, 3 items at most"
  - "after q-pages is answered: one conversation per kept page, from page-questions.yml, rounds 8+"
team_files:
  - from: question-bank.yml
    to: null              # reference; the skill reads it from this folder, never copies it
  - from: STRATEGY.md
    to: null
  - from: sitemap.md
    to: null
  - from: page-questions.yml
    to: null
skill: church-website-discovery
